variables:
  GIT_SUBMODULE_PATHS: third-party/bitshuffle
  GIT_SUBMODULE_DEPTH: 1
  # Not recursive: lima only builds bitshuffle's bitshuffle.c/bitshuffle_core.c
  # (see control/bitshuffle/CMakeLists.txt), never its nested zstd submodule
  # (only used by bitshuffle's own Python --zstd option). Checking zstd out
  # was the actual source of the recurring "Failed to copy
  # .git/modules/third-party/bitshuffle/modules/zstd/objects/bitmap-ref-tips_*"
  # race with conda-build's source copy: not worth fighting gc.auto timing
  # for a submodule we never use - just stop cloning it.
  GIT_SUBMODULE_STRATEGY: normal
  # Disable git's background auto-gc for every git invocation, including the
  # runner's own checkout/submodule-update before `script:` runs - that's
  # where the bitshuffle/zstd .git copy race actually happens, too early for
  # a `git config --global` in script to help.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: gc.auto
  GIT_CONFIG_VALUE_0: 0

stages:
  - build
  - deploy

.build-conda: &build-conda
  stage: build
  retry: 2
  artifacts:
    paths:
      - dist/
  tags:
    - conda

build-linux:
  <<: *build-conda
  script:
    - conda mambabuild conda --output-folder=dist/ -c conda-forge --channel=http://bcu-ci.esrf.fr/stable
  tags:
    - linux

build-win:
  <<: *build-conda
  script:
    - call conda mambabuild conda --prefix-length=80 --output-folder=dist/ -c conda-forge --channel=http://bcu-ci.esrf.fr/stable
  tags:
    - win

deploy-devel:
  stage: deploy
  environment:
    name: devel/$CI_COMMIT_REF_NAME
    url: http://bcu-ci.esrf.fr/devel
  dependencies:
    - build-linux
    - build-win
  script:
    - cp -Rf dist/* /conda-devel/
    - flock /conda-devel/.reindex.lock -c "conda index --channeldata /conda-devel/"
  tags:
    - conda
    - linux
  only:
    - branches
  except:
    - stable
  when: manual

deploy-stable:
  stage: deploy
  environment:
    name: production
    url: http://bcu-ci.esrf.fr/stable
  dependencies:
    - build-linux
    - build-win
  script:
    - cp -Rf dist/* /conda/
    - flock /conda/.reindex.lock -c "conda index --channeldata /conda/"
  tags:
    - conda
    - linux
  only:
    - tags
    - stable
